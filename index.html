<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plan de Comidas</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap');

:root{
  --bg:#15161a;
  --surface:#1d1f24;
  --surface-2:#24262c;
  --ink:#f2efe9;
  --ink-dim:#9a9da6;
  --line:rgba(242,239,233,0.09);
  --blue:#4b86bd;
  --red:#c1442d;
  --gold:#d9a441;
  --violet:#8a6cd1;
  --blue-soft:rgba(75,134,189,0.12);
  --red-soft:rgba(193,68,45,0.12);
  --gold-soft:rgba(217,164,65,0.14);
  --violet-soft:rgba(138,108,209,0.13);
}

*{box-sizing:border-box;margin:0;padding:0;}

body{
  background:
    radial-gradient(ellipse 900px 500px at 15% -10%, rgba(75,134,189,0.08), transparent),
    radial-gradient(ellipse 900px 500px at 90% 110%, rgba(193,68,45,0.07), transparent),
    var(--bg);
  color:var(--ink);
  font-family:'Inter',sans-serif;
  min-height:100vh;
  padding:28px 16px 60px;
}

.wrap{max-width:640px;margin:0 auto;}

/* ---- Header / scoreboard ---- */
header{margin-bottom:22px;}
.eyebrow{
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  letter-spacing:.18em;
  color:var(--ink-dim);
  text-transform:uppercase;
  margin-bottom:6px;
}
h1{
  font-family:'Bebas Neue',sans-serif;
  font-size:44px;
  letter-spacing:.02em;
  line-height:1;
  color:var(--ink);
}
h1 span{color:var(--gold);}
.subtitle{
  color:var(--ink-dim);
  font-size:14px;
  margin-top:6px;
}

/* progress dots */
.round-track{
  display:flex;
  gap:8px;
  margin-top:18px;
}
.round-dot{
  flex:1;
  height:6px;
  border-radius:3px;
  background:var(--surface-2);
  overflow:hidden;
  position:relative;
}
.round-dot::after{
  content:'';
  position:absolute; inset:0;
  background:var(--accent,var(--gold));
  transform:scaleX(0);
  transform-origin:left;
  transition:transform .35s ease;
}
.round-dot.done::after{transform:scaleX(1);}

/* ---- Tabs (rounds) ---- */
nav.rounds{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin:22px 0 20px;
}
.round-btn{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:10px;
  padding:10px 6px 9px;
  cursor:pointer;
  text-align:center;
  transition:all .2s ease;
  color:var(--ink-dim);
}
.round-btn .rnum{
  font-family:'JetBrains Mono',monospace;
  font-size:10px;
  letter-spacing:.12em;
  display:block;
  opacity:.7;
  margin-bottom:2px;
}
.round-btn .rname{
  font-family:'Bebas Neue',sans-serif;
  font-size:16px;
  letter-spacing:.03em;
  display:block;
  color:var(--ink);
}
.round-btn.active{
  border-color:var(--accent);
  background:var(--accent-soft);
  box-shadow:0 0 0 1px var(--accent) inset;
}
.round-btn.active .rnum{color:var(--accent);opacity:1;}

/* ---- Section label / bell divider ---- */
.section-label{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:14px;
}
.section-label .tag{
  font-family:'Bebas Neue',sans-serif;
  font-size:22px;
  letter-spacing:.03em;
  color:var(--accent);
}
.section-label .bell{
  flex:1;
  height:1px;
  background:linear-gradient(90deg,var(--line),transparent);
}
.section-meta{
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  color:var(--ink-dim);
}

/* ---- Cards ---- */
.combo{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:14px;
  padding:18px 18px 16px;
  margin-bottom:12px;
  position:relative;
  transition:border-color .2s ease, transform .15s ease;
}
.combo.picked{
  border-color:var(--accent);
  box-shadow:0 0 0 1px var(--accent) inset;
}
.combo-head{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:10px;
  margin-bottom:12px;
}
.combo-name{
  font-family:'Bebas Neue',sans-serif;
  font-size:21px;
  letter-spacing:.02em;
}
.combo-num{
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  color:var(--accent);
  background:var(--accent-soft);
  padding:3px 8px;
  border-radius:20px;
  white-space:nowrap;
}
.ingredients{list-style:none;}
.ingredients li{
  display:flex;
  gap:10px;
  padding:7px 0;
  border-top:1px solid var(--line);
  font-size:14px;
  line-height:1.45;
  color:var(--ink);
}
.ingredients li:first-child{border-top:none;}
.ingredients li .qty{
  font-family:'JetBrains Mono',monospace;
  font-size:12.5px;
  color:var(--accent);
  white-space:nowrap;
  min-width:56px;
  padding-top:1px;
}
.ingredients li .desc{color:var(--ink-dim);}
.ingredients li .desc b{color:var(--ink);font-weight:600;}

.mark-btn{
  margin-top:14px;
  width:100%;
  background:transparent;
  border:1px solid var(--line);
  color:var(--ink-dim);
  font-family:'Inter',sans-serif;
  font-weight:600;
  font-size:13px;
  padding:10px;
  border-radius:9px;
  cursor:pointer;
  transition:all .18s ease;
  letter-spacing:.01em;
}
.mark-btn:hover{border-color:var(--accent);color:var(--ink);}
.combo.picked .mark-btn{
  background:var(--accent);
  border-color:var(--accent);
  color:#15161a;
}

footer{
  margin-top:30px;
  text-align:center;
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  color:var(--ink-dim);
  letter-spacing:.05em;
}
footer .reset{
  display:block;
  margin:10px auto 0;
  background:none;
  border:none;
  color:var(--ink-dim);
  text-decoration:underline;
  cursor:pointer;
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
}

@media (max-width:420px){
  h1{font-size:36px;}
  .round-btn .rname{font-size:14px;}
}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="eyebrow" id="today-label">CARGANDO FECHA…</div>
    <h1>Plan de <span>Comidas</span></h1>
    <div class="subtitle">Elige tu ronda del día y marca lo que ya has hecho.</div>
    <div class="round-track" id="round-track"></div>
  </header>

  <nav class="rounds" id="rounds"></nav>

  <main id="content"></main>

  <footer>
    <span id="footer-msg">4 rondas · elige tu combo en cada una</span>
    <div id="save-status" style="margin-top:8px;font-size:11px;"></div>
    <button class="reset" id="reset-btn">Borrar marcas de hoy</button>
  </footer>

</div>

<script>
const MEALS = [
  {
    key:'desayuno', label:'Desayuno', round:'R1', accent:'#4b86bd', accentSoft:'rgba(75,134,189,0.12)',
    combos:[
      { name:'Sándwich con Tiempo', items:[
        ['2 ud','Rebanadas de pan de molde integral o espelta'],
        ['110 g','Jamón de york o pavo braseado (4–5 lonchas finas de paquete)'],
        ['2 ud (~40g)','Lonchas de queso light']
      ]},
      { name:'Batido "To-Go"', items:[
        ['40 g','Harina de avena o crema de cereales en polvo'],
        ['35 g','Proteína o caseína en polvo'],
        ['15 g','Crema de cacahuete 100% o frutos secos'],
        ['al gusto','Agua o leche vegetal ligera']
      ]},
      { name:'Tacos de Desayuno', items:[
        ['2 ud (~40g)','Tortillas de trigo pequeñas o 80g de masa de maíz casera'],
        ['1 + 100g','Huevo entero + claras de huevo pasadas por sartén'],
        ['60 g','Tiras de pechuga de pollo, ternera o lonchas de lomo']
      ]}
    ]
  },
  {
    key:'comida', label:'Comida', round:'R2', accent:'#c1442d', accentSoft:'rgba(193,68,45,0.12)',
    combos:[
      { name:'Combo Express Arroz + Tortilla', items:[
        ['125 g','Vasito de arroz Brilliant al microondas'],
        ['1 ud (40g)','Tortilla de trigo (comprada) — o hecha por ti con 80g de masa de maíz'],
        ['200 g','Pechuga de pollo o lomo de cerdo a la plancha/salteado (dos filetes)'],
        ['libre','Verduras al gusto (pimientos, cebolla o ensalada)']
      ]},
      { name:'Plato Caliente · Pasta / Udon', items:[
        ['90 g seco','Pasta integral o 1 paquete de fideos udon (~200g hidratados)'],
        ['200 g','Pechuga de pollo, pavo o ternera magra salteada'],
        ['libre','Verduras variadas + salsa de soja baja en sodio']
      ]},
      { name:'Buddha Bowl / Poke Bowl', items:[
        ['125 g + 30g','Vasito de arroz Brilliant al microondas + legumbres'],
        ['190 g','Pechuga de pollo, lomo de cerdo (dos filetes) o 2 latas de atún al natural'],
        ['abundante','Canónigos/lechuga, pepino, zanahoria y tomates cherry'],
        ['15 g','Salsa ligera tipo yogur o chorrito de lima y soja']
      ]}
    ]
  },
  {
    key:'pre-entreno', label:'Pre-Entreno', round:'R3', accent:'#d9a441', accentSoft:'rgba(217,164,65,0.14)',
    combos:[
      { name:'Crema de Arroz Pre-Entreno', items:[
        ['45 g','Crema de arroz diluida en agua'],
        ['20 g','Proteína en polvo (sabor a elegir)'],
        ['opcional','100g de plátano o 150g de fresas/frutos rojos']
      ]}
    ]
  },
  {
    key:'cena', label:'Cena', round:'R4', accent:'#8a6cd1', accentSoft:'rgba(138,108,209,0.13)',
    combos:[
      { name:'"Fizza" Fitness de Trigo', items:[
        ['2 ud','Tortillas mexicanas de trigo'],
        ['80 g','Tomate triturado + orégano'],
        ['190 g','Pechuga de pollo desmenuzada o ternera picada magra'],
        ['40 g','Queso mozzarella light']
      ]},
      { name:'Smash Burger Doble + Patatas Airfryer', items:[
        ['200 g','Carne picada magra de ternera (2 bolas aplastadas a la sartén)'],
        ['1 ud (~65g)','Pan de hamburguesa brioche o ligero'],
        ['1 ud (~20g)','Loncha de queso light + pepinillos y lechuga'],
        ['180 g','Patata en bastones hecha en la airfryer']
      ]},
      { name:'Burrito / Durum o Quesadilla', items:[
        ['2 ud (60g)','Tortillas de trigo grande'],
        ['200 g','Pechuga de pollo especiada estilo kebab o ternera'],
        ['80 g','Lechuga, cebolla y salsa ligera (yogur desnatado con ajo/especias)']
      ]}
    ]
  }
];

let activeMeal = MEALS[0].key;
let todayKey = '';
let picks = {}; // { mealKey: comboIndex }

function fmtDate(d){
  const dias=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
  const meses=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  return `${dias[d.getDay()]}, ${d.getDate()} ${meses[d.getMonth()]}`.toUpperCase();
}

function setStatus(msg, isError){
  const el = document.getElementById('save-status');
  if(!el) return;
  el.textContent = msg;
  el.style.color = isError ? '#c1442d' : '#6f9e6a';
}

async function loadPicks(){
  if(!window.storage){
    picks = {};
    setStatus('⚠ Guardado no disponible en esta vista (abre el archivo desde el chat, no una copia descargada)', true);
    return;
  }
  try{
    const res = await window.storage.get(`picks:${todayKey}`);
    picks = res && res.value ? JSON.parse(res.value) : {};
    setStatus('');
  }catch(e){
    // Missing key throws — that's normal on first use, not an error
    picks = {};
    setStatus('');
  }
}

async function savePicks(){
  if(!window.storage){
    setStatus('⚠ No se pudo guardar: almacenamiento no disponible aquí', true);
    return;
  }
  try{
    const result = await window.storage.set(`picks:${todayKey}`, JSON.stringify(picks));
    setStatus(result ? '✓ Guardado' : '⚠ No se pudo guardar', !result);
    if(result){ setTimeout(()=>setStatus(''), 1500); }
  }catch(e){
    setStatus('⚠ Error al guardar: ' + (e && e.message ? e.message : 'desconocido'), true);
  }
}

function renderRounds(){
  const nav = document.getElementById('rounds');
  nav.innerHTML = '';
  MEALS.forEach(m=>{
    const btn = document.createElement('div');
    btn.className = 'round-btn' + (m.key===activeMeal ? ' active':'');
    btn.style.setProperty('--accent', m.accent);
    btn.style.setProperty('--accent-soft', m.accentSoft);
    btn.innerHTML = `<span class="rnum">${m.round}</span><span class="rname">${m.label}</span>`;
    btn.addEventListener('click', ()=>{ activeMeal = m.key; render(); });
    nav.appendChild(btn);
  });
}

function renderTrack(){
  const track = document.getElementById('round-track');
  track.innerHTML = '';
  MEALS.forEach(m=>{
    const dot = document.createElement('div');
    dot.className = 'round-dot' + (picks[m.key]!==undefined ? ' done':'');
    dot.style.setProperty('--accent', m.accent);
    track.appendChild(dot);
  });
}

function renderContent(){
  const meal = MEALS.find(m=>m.key===activeMeal);
  const content = document.getElementById('content');
  content.innerHTML = '';

  const label = document.createElement('div');
  label.className = 'section-label';
  label.innerHTML = `<span class="tag" style="color:${meal.accent}">${meal.round} · ${meal.label.toUpperCase()}</span><span class="bell"></span><span class="section-meta">${meal.combos.length} ${meal.combos.length>1?'opciones':'opción'}</span>`;
  content.appendChild(label);

  meal.combos.forEach((combo, idx)=>{
    const picked = picks[meal.key]===idx;
    const card = document.createElement('div');
    card.className = 'combo' + (picked ? ' picked':'');
    card.style.setProperty('--accent', meal.accent);
    card.style.setProperty('--accent-soft', meal.accentSoft);

    const itemsHtml = combo.items.map(([qty,desc])=>{
      return `<li><span class="qty">${qty}</span><span class="desc">${desc}</span></li>`;
    }).join('');

    card.innerHTML = `
      <div class="combo-head">
        <span class="combo-name">${combo.name}</span>
        <span class="combo-num">COMBO ${idx+1}</span>
      </div>
      <ul class="ingredients">${itemsHtml}</ul>
      <button class="mark-btn">${picked ? '✓ Hecho hoy' : 'Marcar como hecho hoy'}</button>
    `;

    card.querySelector('.mark-btn').addEventListener('click', async ()=>{
      if(picks[meal.key]===idx){ delete picks[meal.key]; }
      else{ picks[meal.key] = idx; }
      await savePicks();
      render();
    });

    content.appendChild(card);
  });
}

function renderFooter(){
  const done = Object.keys(picks).length;
  document.getElementById('footer-msg').textContent = `${done}/4 rondas marcadas hoy`;
}

function render(){
  renderRounds();
  renderTrack();
  renderContent();
  renderFooter();
}

document.getElementById('reset-btn').addEventListener('click', async ()=>{
  picks = {};
  await savePicks();
  render();
});

(async function init(){
  const now = new Date();
  todayKey = now.toISOString().slice(0,10);
  document.getElementById('today-label').textContent = fmtDate(now);
  await loadPicks();
  render();
})();
</script>
</body>
</html>
